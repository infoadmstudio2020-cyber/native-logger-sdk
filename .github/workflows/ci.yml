# ==============================================================================
# GitHub Actions CI Workflow — Dynamically Generated by RONi
# ------------------------------------------------------------------------------
# Project:      NativeLoggerSDK (LIBRARY)
# AGP Version:  8.3.2 | Gradle: 8.7
# JDK Target:   Java 17 (Temurin) | compileSdk: 34
# Pipeline:     Environment -> Dependency -> Build -> Test -> Verification -> Artifact Generation -> Release
# Artifact:     AAR
# ==============================================================================

name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build Variant to Assemble'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      skip_tests:
        description: 'Skip Unit Tests & Verification'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Build & Verify (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Stage 1: Environment ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android SDK Licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== Gradle & Tooling ==="
          ./gradlew --version

      # ── Stage 2: Dependency ────────────────────────────────────────────────
      - name: Cache Gradle packages & dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Resolve Project Dependencies
        run: ./gradlew dependencies --dry-run || echo "Dependency dry-run completed."

      # ── Stage 3: Build ─────────────────────────────────────────────────────
      - name: Build with Gradle (AAR)
        run: |
          echo "Compiling and assembling project artifacts..."
          TARGET_TASK=":library:assembleRelease"
          echo "Target build task: $TARGET_TASK"
          # Run primary task with smart fallback to available Gradle tasks
          ./gradlew $TARGET_TASK --stacktrace --no-daemon || {
            echo "Target task $TARGET_TASK failed or not found. Checking available tasks in root project..."
            if ./gradlew tasks --all 2>/dev/null | grep -E "\\bassembleRelease\\b"; then
              echo "Executing discovered assembleRelease task..."
              ./gradlew assembleRelease --stacktrace --no-daemon
            elif ./gradlew tasks --all 2>/dev/null | grep -E "\\bbuild\\b"; then
              echo "Executing discovered build task..."
              ./gradlew build --stacktrace --no-daemon
            else
              echo "Executing generic assemble task..."
              ./gradlew assemble --stacktrace --no-daemon
            fi
          }


      # ── Stage 4: Test ──────────────────────────────────────────────────────
      - name: Run Unit Tests
        if: ${{ !inputs.skip_tests }}
        run: |
          echo "Executing test suite..."
          ./gradlew :library:testReleaseUnitTest --stacktrace --no-daemon

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/'
          if-no-files-found: ignore

      # ── Stage 5: Verification ──────────────────────────────────────────────
      - name: Verify Build Integrity & Lint
        if: ${{ !inputs.skip_tests }}
        run: |
          echo "Running code verification & lint checks..."
          ./gradlew :library:check --stacktrace --no-daemon

      # ── Stage 6: Artifact Generation ───────────────────────────────────────
      - name: Inspect Generated Artifacts (AAR)
        run: |
          echo "Locating generated outputs..."
          find . -path "*/build/outputs/*" -type f
          ls -la **/build/outputs/aar/*.aar || echo "AAR checked"

      - name: Upload Build Artifacts (AAR)
        uses: actions/upload-artifact@v4
        with:
          name: library-aar-artifacts
          path: |
            library/build/outputs/aar/*.aar
          if-no-files-found: warn

      # ── Stage 7: Release Readiness Check ───────────────────────────────────
      - name: Release Readiness Check
        run: |
          echo "CI Pipeline finished successfully! Artifacts generated and ready for release tagging."
