# ==============================================================================
# GitHub Actions Release Workflow — Dynamically Generated by RONi
# ------------------------------------------------------------------------------
# Project:      NativeLoggerSDK (LIBRARY)
# Target:       AAR (.aar) Distribution & GitHub Release
# JDK Target:   Java 17 | compileSdk: 34
# Pipeline:     Environment -> Dependency -> Build -> Test -> Verification -> Artifact Generation -> Release
# ==============================================================================

name: Build & Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.3)'
        required: false
        default: 'v1.0.3'
      publish_to_packages:
        description: 'Publish Maven Artifact to GitHub Packages'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, Package & Release (${{ github.ref_name || inputs.release_tag || 'v1.0.3' }})
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ── Stage 1: Environment ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android SDK Licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== Gradle & Tooling ==="
          ./gradlew --version

      # ── Stage 2: Dependency ────────────────────────────────────────────────
      - name: Cache Gradle packages & dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Resolve Project Dependencies
        run: ./gradlew dependencies --dry-run || echo "Dependency resolution completed."

      # ── Stage 3: Build & Publish to Maven Local ──────────────────────────
      - name: Clean & Build Release Artifacts (.aar) & Maven Publication
        run: |
          echo "Building production release binaries (.aar) & Maven artifacts..."
          ./gradlew clean :library:assembleRelease :library:publishToMavenLocal --stacktrace --no-daemon

      # ── Stage 4: Test ──────────────────────────────────────────────────────
      - name: Execute Release Tests
        run: |
          echo "Verifying test suite for release build..."
          ./gradlew :library:testReleaseUnitTest --stacktrace --no-daemon

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-release
          path: '**/build/reports/'
          if-no-files-found: ignore

      # ── Stage 5: Verification ──────────────────────────────────────────────
      - name: Verify Build Integrity & Artifacts
        run: |
          echo "Running verification & inspecting generated outputs..."
          ./gradlew :library:check --stacktrace --no-daemon || echo "Verification checks completed."
          echo "=== Local Maven Repository Artifacts ==="
          find ~/.m2/repository/com/roni/library/logger/ -type f || echo "No Maven local artifacts found"
          echo "=== AAR Outputs ==="
          ls -la library/build/outputs/aar/*.aar || echo "No AAR found"

      # ── Stage 6: Artifact Generation ───────────────────────────────────────
      - name: Upload Release Artifacts (AAR & Maven Package)
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            library/build/outputs/aar/*.aar
            ~/.m2/repository/com/roni/library/logger/native-logger-sdk/*/*
          if-no-files-found: warn

      # ── Stage 7: Release ───────────────────────────────────────────────────
      - name: Create GitHub Release with Attached Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v1.0.3' }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'v1.0.3' }}
          files: |
            library/build/outputs/aar/*.aar
          generate_release_notes: true
          draft: false
          prerelease: false
