// Top-level build file
buildscript {
    ext {
        agp_version       = '8.3.2'
        compileSdkVersion = 34
        minSdkVersion     = 21
        targetSdkVersion  = 34
    }
}

plugins {
    id 'com.android.library' version "8.3.2" apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
